name: CI/CD

on:
  push:
    branches: [ main, dev ]
    tags: ['v*']
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    if: github.event_name == 'pull_request' || github.ref_type == 'branch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Create venv
      run: uv venv --python ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv pip install -e ".[dev]"

    - name: Run tests
      run: |
        uv run pytest

  build:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v3
      with:
        version: "latest"

    - name: Set up Python
      run: uv python install 3.11

    - name: Build package
      run: |
        uv build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-assets/

    - name: Flatten release assets
      run: |
        mkdir -p dist
        find release-assets/ -type f | while read f; do
          cp "$f" dist/
        done
        echo "Release contents:"
        ls -la dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-blockly:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [release]
    runs-on: ubuntu-latest

    steps:
    - name: Trigger blockly build
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.BLOCKLY_PAT }}" \
          https://api.github.com/repos/wlkata/Blockly/dispatches \
          -d '{"event_type":"sdk-release","client_payload":{"sdk_version":"${{ github.ref_name }}"}}'