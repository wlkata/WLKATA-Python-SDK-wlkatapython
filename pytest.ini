[pytest]
# Pytest configuration for WLKATA Python SDK

# Test paths
testpaths = tests

# Add project root to Python path - this eliminates need for sys.path hacks
pythonpath = .

# Python files to collect tests from
python_files = test_*.py

# Python classes to collect tests from
python_classes = Test*

# Python functions to collect tests from
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Add options
addopts = -v --tb=short

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    hardware: marks tests that would need real hardware (currently all use simulator)

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (requires pytest-timeout)
# timeout = 30
