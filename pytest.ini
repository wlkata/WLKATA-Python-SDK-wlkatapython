[pytest]
# Pytest configuration for WLKATA Python SDK

# Test paths
testpaths = tests

# Add src/ so `wlkatapython` (including simulator) is importable without install
pythonpath = src

# Python files to collect tests from
python_files = test_*.py

# Python classes to collect tests from
python_classes = Test*

# Python functions to collect tests from
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Add options
addopts = -v --tb=short -n 8

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    hardware: marks tests that would need real hardware (currently all use simulator)
    mt4: marks tests for MT4 robot functionality
    e4: marks tests for E4 robot functionality
    mirobot: marks tests for Mirobot robot functionality
    ms4220: marks tests for MS4220 stepper motor functionality
    wlkatapython: marks tests for the main wlkatapython module
    simulator: marks tests for simulator infrastructure
    scripts: marks tests for utility scripts

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (requires pytest-timeout)
# timeout = 30
